version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: christianpure-bible-search_web_1
      APP_PORT: 8417

  web:
    image: ghcr.io/christianpure/bible-search:0.1.0@sha256:DIGEST
    user: "1000:1000"
    restart: on-failure
    environment:
      STUDY_SOURCE: umbrel
    volumes:
      - ${APP_DATA_DIR}/data:/data
